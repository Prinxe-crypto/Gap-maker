name: Run Reference Gap Paper Trading Bot

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Trading Script
        run: python paper_trade_logic_8coins.py

      - name: Commit Updated CSV Files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          touch open_positions.csv closed_positions.csv
          git add open_positions.csv closed_positions.csv
          git diff --staged --quiet || git commit -m "Update open and closed positions [skip ci]"
          git push
