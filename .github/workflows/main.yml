name: Run Reference Gap Paper Trading Bot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-bot]

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Trading Script
        run: python paper_trade_logic_8coins.py

      - name: Commit Updated CSV Files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          touch open_positions.csv closed_positions.csv
          git add open_positions.csv closed_positions.csv
          git diff --staged --quiet || git commit -m "Update open and closed positions [skip ci]"
          git push
          
      - name: Trigger Depth Monitor Repo
        env:
          GH_PAT: ${{ secrets.DEPTH_MONITOR_PAT }}
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $GH_PAT" \
            https://api.github.com/repos/Prinxe-crypto/gap-maker-depth-monitor/dispatches \
            -d '{"event_type": "gap_maker_entry"}'

